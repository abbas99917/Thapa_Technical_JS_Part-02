<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Weather App</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css">
    


</head>
<body>
    <!-- container -->
    <section class="container">
        <!-- inputfield search sections -->
        <div class="weather-header">
            <form class="weather-search">
               <span class="icon"> <i class="fa-solid fa-magnifying-glass" ></i></span>
                <input type="text" placeholder="Search weather" class="search-city">
            </form>
            <!--  -->
        </div>

        <!-- next sections -->
         <div class="weather-body">
            <h1 class="weather-city"></h1>
            <p class="weather-date-time"></p>
            <div class="weather_data">
                <p class="weather_forcast"></p>
                <div class="weather_icon"></div>
            </div>
            <p class="weather_temperature"></p>
            <div class="weather_minmax">
                <p class="weather_min"></p>
                <p class="weather_max"></p>
            </div>
         </div>
         <section class="weather_info">
            <!-- card 01 -->
            <div class="weather_card">
                <i class="fa-solid fa-temperature-empty"></i>
                <div>
                    <p>Feels Like</p>
                    <p class="weather_feelslike">15&#176</p>
                </div>
            </div>
            <!-- card 02 -->
            <div class="weather_card">
                <i class="fa-solid fa-temperature-empty"></i>
                <div>
                    <p>Humidity</p>
                    <p class="Humidity">15&#176</p>
                </div>
            </div>
            <!-- card 03 -->
            <div class="weather_card">
                <i class="fa-solid fa-wind"></i>
                <div>
                    <p>Wind</p>
                    <p class="wind"></p>
                </div>
            </div>
            <!-- card 04 -->
            <div class="weather_card">
                <i class="fa-solid fa-temperature-empty"></i>
                <div>
                    <p>Pressure</p>
                    <p class="pressure"></p>
                </div>
            </div>
         </section>
    </section>


    <script src="weather.js"></script>
</body>
</html>
