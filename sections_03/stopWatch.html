<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Stop Watch</title>
    <style>
* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

body {
    min-height: 100vh;
    display: flex;
    justify-content: center;
    align-items: center;
    font-family: Arial, sans-serif;
    background: linear-gradient(135deg, #141e30, #243b55);
}

.container {
    width: 450px;
    padding: 40px 30px;
    text-align: center;
    background: rgba(255, 255, 255, 0.1);
    border: 1px solid rgba(255, 255, 255, 0.2);
    border-radius: 25px;
    backdrop-filter: blur(12px);
    box-shadow: 0 20px 50px rgba(0, 0, 0, 0.4);
}

h1 {
    color: #fff;
    font-size: 32px;
    margin-bottom: 30px;
}

.rating {
    width: 100%;
    min-height: 100px;
    display: flex;
    justify-content: center;
    align-items: center;
    margin-bottom: 30px;
    padding: 15px;
    border-radius: 15px;
    background: #080808;
    color: #00ff88;
    font-size: 52px;
    font-weight: bold;
    font-family: "Courier New", monospace;
    letter-spacing: 4px;
    text-shadow: 0 0 15px #00ff88;
    box-shadow:
        inset 0 0 20px rgba(0, 255, 136, 0.15),
        0 0 15px rgba(0, 255, 136, 0.15);
}

.buttons {
    display: flex;
    flex-wrap: wrap;
    justify-content: center;
    gap: 12px;
}

button {
    border: none;
    outline: none;
    padding: 12px 20px;
    border-radius: 10px;
    color: white;
    font-size: 16px;
    font-weight: bold;
    cursor: pointer;
    transition: 0.2s ease;
}

/* Start */
#start-btn {
    background: #00a86b;
}

#start-btn:hover {
    background: #00d084;
    transform: translateY(-2px);
}

/* Stop */
#stop-btn {
    background: #e63946;
}

#stop-btn:hover {
    background: #ff4d5a;
    transform: translateY(-2px);
}

/* Reset */
#reset-btn {
    background: #ff9800;
}

#reset-btn:hover {
    background: #ffb52e;
    transform: translateY(-2px);
}

/* Get Time */
#get-time {
    background: #0077ff;
}

#get-time:hover {
    background: #3395ff;
    transform: translateY(-2px);
}

/* Clear Time */
#clear-time {
    background: #6c63ff;
}

#clear-time:hover {
    background: #827aff;
    transform: translateY(-2px);
}

button:active {
    transform: scale(0.95);
}

/* Mobile Responsive */
@media (max-width: 500px) {
    .container {
        width: 90%;
        padding: 30px 20px;
    }

    h1 {
        font-size: 26px;
    }

    .rating {
        font-size: 38px;
    }

    button {
        padding: 10px 15px;
        font-size: 14px;
    }
}

    </style>
</head>
<body>
    
<div class="container">
    <h1>Stop Watch ⌚</h1>
    <p class="rating">0</p>
    <div class="buttons">
        <button id="start-btn">Start</button>
        <button id="stop-btn">Stop</button>
        <button id="reset-btn">Reset</button>
        <button id="get-time">Get Time</button>
        <button id="clear-time">clear Time</button>
    </div>
    <div id="curValue"></div>
</div>
    <script src="stopWatch.js"></script>
</body>
</html>
