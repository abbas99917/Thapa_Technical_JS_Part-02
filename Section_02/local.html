<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title> To Do App | Local Storage</title>
    <style>
        * {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
    font-family: Arial, sans-serif;
}

body {
    min-height: 100vh;
    display: flex;
    justify-content: center;
    align-items: center;
    background: linear-gradient(135deg, #667eea, #764ba2);
}

.container {
    width: 420px;
    background: #fff;
    padding: 30px;
    border-radius: 15px;
    box-shadow: 0 15px 35px rgba(0, 0, 0, 0.2);
}

h1 {
    text-align: center;
    margin-bottom: 25px;
    color: #333;
    font-size: 32px;
}

form {
    display: flex;
    flex-wrap: wrap;
    gap: 10px;
}

#inputfield {
    flex: 1;
    min-width: 250px;
    padding: 13px 15px;
    border: 2px solid #ddd;
    border-radius: 8px;
    outline: none;
    font-size: 15px;
    transition: 0.3s;
}

#inputfield:focus {
    border-color: #667eea;
}

#add {
    padding: 13px 18px;
    border: none;
    border-radius: 8px;
    background: #667eea;
    color: white;
    font-size: 15px;
    cursor: pointer;
    transition: 0.3s;
}

#add:hover {
    background: #5568d8;
    transform: translateY(-2px);
}
.element{
    display: flex;
    justify-content: space-between;
}
.element li {
    list-style: none;
    color: #333;
    font-size: 17px;
    font-weight: 500;
    padding: 10px 15px;
}

.delBtn {
    background-color: #ff4d4d;
    color: white;
    border: none;
    padding: 8px 15px;
    border-radius: 6px;
    font-size: 14px;
    cursor: pointer;
}

.delBtn:hover {
    background-color: #e63939;
}


    </style>
</head>
<body>
    
<!-- <div class="container">
    <button id="btn1">set data to local storage</button>
    <button id="btn2">getitem from localStorage</button>
    <button id="btn3">remove data from localStorage</button>
</div> -->
<div class="container">
    <h1>Todo app</h1>
    <form >
        <input type="text" placeholder="add your task" id="inputfield">
        <button id="add">add todo</button>
        <section class="todoElement"></section>
    </form>
</div>
    <script src="local.js"></script>
</body>
</html>
