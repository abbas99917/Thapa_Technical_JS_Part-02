<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Events</title>
</head>
<body>
    

    <h1>Inline Event</h1>

    <!-- Inline Events Handlers -->

    <!-- onclick event -->
    <button onclick="alert('welcome')" >Evnets</button>
    <!-- dblclick event -->
    <button ondblclick="alert('welcom js course')">greeting again</button>
    <!-- mouseover event -->
     <button onmouseover="alert('on mouse events')">mouse Over event</button>

     <!-- using DOM Events Handlers -->

     <button id="btn">DOM Events</button>
     <button></button>

    <script src="main.js"></script>
</body>
</html>
